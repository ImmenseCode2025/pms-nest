<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>GRC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body,
    table,
    td,
    a {
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    table,
    td {
      mso-table-rspace: 0pt;
      mso-table-lspace: 0pt;
    }

    img {
      -ms-interpolation-mode: bicubic;
    }

    a[x-apple-data-detectors] {
      font-family: inherit !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
      color: inherit !important;
      text-decoration: none !important;
    }

    body {
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    table {
      border-collapse: collapse !important;
    }

    a {
      color: #000;
    }

    img {
      height: auto;
      line-height: 100%;
      text-decoration: none;
      border: 0;
      outline: none;
    }
  </style>
</head>

<body style="background-color: #e9ecef">
  <div style="
        background-color: #ffffff;
        margin: 0 auto;
        text-align: center;
        padding-top: 30px;
        padding-bottom: 30px;
      ">
    <!-- Content Placement Start -->
    <div style="
          max-width: 600px;
          margin-left: auto;
          margin-right: auto;
          border: 1px solid #063453;
          border-radius: 8px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        ">
      <div style="
            font-family: 'Sans-serif', Helvetica, Arial, sans-serif;
            background-color: #063453;
            color: #fff;
          ">
        <h1 style="font-size: 32px; color: #fff; padding: 10px 0px">
          GRC One-Time Password (OTP)
        </h1>
      </div>
      <div style="
            padding: 36px 24px;
            font-family: 'Sans-serif', Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 24px;
          ">
        <p style="margin: 0">Please use the OTP code below to proceed :</p>
        <div style="
              margin: 30px 0;
              font-size: 28px;
              font-weight: bold;
              color: #1c2434;
              letter-spacing: 4px;
            ">
          {{otp}}
        </div>
        <p style="margin: 0; font-weight: bold; color: #dc3545">
          Note: This OTP will expire in 5 minute.
        </p>
      </div>
    </div>
  </div>
</body>

</html>
